# Шрифт
font_family      JetBrains Mono
font_size        12.0

# Прозрачность и фон
background_opacity 0.85
background_blur 32
background #0A0E1A
foreground #C8D6E5

background_image ~/.config/kitty/bg.jpg
background_image_layout scaled
background_tint 0.9

# Курсор
cursor #6B8CAF
cursor_text_color #0A0E1A

# Выделение текста
selection_background #4A6FA5
selection_foreground #FFFFFF

# Рамка окна
window_padding_width 10
hide_window_decorations no

# Цвета (палитра под ваши обои — приглушённые синие/серые тона)
color0  #0A0E1A
color8  #3a4556
color1  #c66b6b
color9  #e08a8a
color2  #7ea88a
color10 #9fc9ab
color3  #c9a876
color11 #e0c296
color4  #6b8caf
color12 #8fb0d1
color5  #a08cc4
color13 #c0a8e0
color6  #6bb3c9
color14 #8fd1e0
color7  #c8d6e5
color15 #ffffff

active_border_color #8fb0d1
inactive_border_color #8fb0d1
window_border_width 1pt
# Запуск shell
shell zsh

# Вкладки (если будете использовать)
tab_bar_style powerline

# Подключаем сессию как запуск по умолчанию
startup_session ~/.config/kitty/session.conf
confirm_os_window_close 0
